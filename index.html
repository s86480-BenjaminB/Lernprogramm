<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lern.IO</title>

  <!-- Manifest & Icon für PWA -->
  <link rel="manifest" href="scripts/json/manifest.json" />
  <link rel="icon" href="images/main_icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="scripts/css/style.css" />

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
  <div class="app-container">
    
    <!-- Navbar -->
    <nav class="sidebar">
      <div class="branding">
        <img src="images/main_icon.png" alt="App Icon" class="app-icon" />
        <h1 class="app-title">Lern.IO</h1>
      </div>
      <ul class="nav-links">
        <li><a href="#" data-view="mathe">📐 Mathematik</a></li>
        <li><a href="#" data-view="internettechnologie">🌐 Internettechnologie</a></li>
        <li><a href="#" data-view="geschichte">📜 Geschichte</a></li>
        <li><a href="#" data-view="noten">🎵 Noten</a></li>
      </ul>
    </nav>

    <!-- Main Box (für Fragenansicht) -->
     <!-- Start-view -->
    <main class="main-content">
      <section id="view-start" class="view">
        <h2>Was möchtest du lernen?</h2>
        <div class="start-buttons">
          <button data-view="mathe">📐 Mathematik</button>
          <button data-view="internettechnologie">🌐 Internettechnologie</button>
          <button data-view="geschichte">📜 Geschichte</button>
          <button data-view="noten">🎵 Noten</button>
        </div>
      </section>

      <!-- Ansicht: Mathematik -->
      <section id="view-mathe" class="view hidden">
        <h2>Mathematik</h2>
        <!-- Fragenanzeige -->
        <div id="frage-box">
          <div class="question-area">
            <p id="frage-text"></p>
            <div id="antwort-buttons" class="answer-buttons"></div>
          </div>
          <div class="progress-area">
            <div id="progress-bar" class="progress-container"></div>
          </div>
        </div>
        <!-- Progress bar -->
        <div class="progress-area">
          <progress id="progress-bar-mathe"></progress>
        </div>

        <!-- Auswertung -->
        <div id="auswertung-box" class="hidden auswertung-box">
          <h3>Ergebnis</h3>
          <p id="auswertung-text"></p>
          <button id="restart-btn" onclick="matheNeuStarten()">🔁 Nochmal starten</button>
        </div>
      </section>      

      <!-- Ansicht: IT -->
       <section id="view-internettechnologie" class="view hidden">
        <h2>Internettechnologie</h2>
        <!-- Fragenanzeige-->
        <div id="it-frage-box">
          <div class="question-area">
            <p id="it-frage-text"></p>
            <div id="it-antwort-buttons" class="answer-buttons"></div>
          </div>
          <!-- Progress bar -->
          <div class="progress-area">
            <progress id="progress-bar-it"></progress>
          </div>
        </div>
        <!-- Auswertungg -->
        <div id="it-auswertung-box" class="hidden auswertung-box">
          <h3>Ergebnis</h3>
          <p id="it-auswertung-text"></p>
          <button id="it-restart-btn">🔁 Nochmal starten</button>
        </div>
      </section>

      <!-- Ansicht: Geschichte -->
      <section id="view-geschichte" class="view hidden">
        <h2>Geschichte</h2>
        <!-- Fragenanzeige -->
      
        <div id="geschichte-frage-box">
          <div class="question-area">
            <p id="geschichte-frage-text"></p>
            <div id="geschichte-antwort-buttons" class="answer-buttons"></div>
          </div>
          <!-- Progress bar -->
          <div class="progress-area">
            <progress id="progress-bar-geschichte"></progress>
          </div>
        </div>
      
        <!-- Auswertung -->
        <div id="geschichte-auswertung-box" class="hidden auswertung-box">
          <h3>Ergebnis</h3>
          <p id="geschichte-auswertung-text"></p>
          <button id="geschichte-restart-btn">🔁 Nochmal starten</button>
        </div>
      </section>
      

      <!-- Ansicht: Noten -->
      <section id="view-noten" class="view hidden">
        <h2>Noten Lernen</h2>
        <div id="noten-box">
          <div id="notation" style="margin-bottom: 1rem;"></div>
          <div id="noten-antwort-buttons" class="answer-buttons"></div>
        </div>
        <!-- Progresss bar -->
        <div class="progress-area">
          <progress id="progress-bar-noten"></progress>
        </div>
        <!-- Auswertung-->
        <div id="noten-auswertung-box" class="hidden auswertung-box">
          <p id="noten-auswertung-text"></p>
          <button id="noten-restart-btn">🔁 Nochmal starten</button>
        </div>
      </section>
    </main>

    <!-- Rechts: Anzeigebox für Online/Offline -->
    <aside class="statusbar">
      <p id="connection-status">🟢 Online</p>
    </aside>
  </div>

  <!-- JS -->
  <!-- Vex für Notendarstellung -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow/build/cjs/vexflow.js"></script>

  <script src="scripts/js/navigation.js"></script>
  <script src="scripts/js/rest.js"></script>
  <script src="scripts/js/questionloader.js"></script>

  <!-- Service Worker Registrierung -->
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registriert'))
        .catch(err => console.error('❌ Fehler beim Registrieren:', err));
    }
  </script>

</body>
</html>
