<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernApp</title>

  <!-- Manifest & Icon für PWA -->
  <link rel="manifest" href="../json/manifest.json" />
  <link rel="icon" href="../../images/main_icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css" />

  <!-- KaTeX Styles & Scripts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
  <div class="app-container">
    
    <!-- Navbar -->
    <nav class="sidebar">
      <div class="branding">
        <img src="../../images/main_icon.png" alt="App Icon" class="app-icon" />
        <h1 class="app-title">LernApp</h1>
      </div>
      <ul class="nav-links">
        <li><a href="#" data-view="mathe">📐 Mathematik</a></li>
        <li><a href="#" data-view="natur">🔬 Naturwissenschaften</a></li>
        <li><a href="#" data-view="eigene">➕ Eigene Karten</a></li>
      </ul>
    </nav>

    <!-- Main Box (für Fragenansicht) -->
    <main class="main-content">
      <!-- Ansicht: Mathematik -->
      <section id="view-mathe" class="view">
        <h2>Mathematik</h2>
        <!-- Fragenanzeige -->
        <div id="frage-box">
          <div class="question-area">
            <p id="frage-text"></p>
            <div id="antwort-buttons" class="answer-buttons"></div>
          </div>
          <div class="progress-area">
            <div id="progress-bar" class="progress-container"></div>
          </div>
        </div>
        <!-- Progress bar -->
        <div class="progress-area">
          <progress id="progress-bar" max="1" value="0"></progress>
        </div>

        <!-- Auswertung -->
        <div id="auswertung-box" class="hidden auswertung-box">
          <h3>Ergebnis</h3>
          <p id="auswertung-text"></p>
          <button id="restart-btn" onclick="matheNeuStarten()">🔁 Nochmal starten</button>
        </div>
      </section>      

      <!-- Ansicht: Naturwissenschaften -->
      <section id="view-natur" class="view hidden">
        <h2>Naturwissenschaften</h2>
        <p>Hier erscheinen Aufgaben aus Physik, Biologie etc.</p>
      </section>

      <!-- Ansicht: eigene Karten -->
      <section id="view-eigene" class="view hidden">
        <h2>Eigene Lernkarten</h2>
        <p>Hier kann man später mal eigene Fragen erstellen(?).</p>
      </section>
    </main>

    <!-- Rechts: Anzeigebox für Online/Offline -->
    <aside class="statusbar">
      <p id="connection-status">🟢 Online</p>
    </aside>
  </div>

  <!-- JS -->
  <script src="../js/navigation.js"></script>
  <script src="../js/questionloader.js"></script>

  <!-- Service Worker Registrierung -->
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../js/sw.js')
        .then(() => console.log('✅ Service Worker registriert'))
        .catch(err => console.error('❌ Fehler beim Registrieren:', err));
    }
  </script>

</body>
</html>
